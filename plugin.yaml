name: hermes-ui-cards
version: 0.1.0
manifest_version: 2
description: Interactive answer cards in Hermes Desktop and the Hermes Webapp, with text elsewhere.
author: robbyczgw-cla
license: MIT
homepage: https://github.com/robbyczgw-cla/hermes-ui-cards
requires_hermes: ">=0.22.6"
tags: [desktop, ui, cards]
provides_tools:
  - hui_present
provides_hooks:
  - pre_llm_call
  - transform_llm_output
  - post_compaction
requires_env: []
config_schema:
  enabled:
    type: bool
    default: true
    label: Interactive cards
    description: Off = new cards in Hermes Desktop come as plain text too (cards already on screen stay interactive).
  compact:
    type: bool
    default: false
    label: Compact cards
    description: Less padding and smaller images, for narrow split views.
  accent:
    type: str
    choices: [app, blue, green, orange, purple, red]
    default: app
    label: Accent colour
    description: "app = the accent of your Desktop theme."
  undo_seconds:
    type: str
    choices: ["0", "4", "8"]
    default: "4"
    label: Undo time (seconds)
    description: "How long a compare pick, a plan's Run, a review's Apply and a medium/high-risk Yes wait before they are sent, so you can undo them. 0 = send at once."
  card_types:
    type: list
    default: [plan, review, checklist, compare, form, confirm, steps, decision, calc, rank, choice, schedule, recipe, flashcards, rating, slider, quiz]
    label: Card types
    description: "Card types Hermes may show. Remove a name to turn that type off; an empty list means all. hui_present refuses turned-off types at once; the tool description follows after a Hermes restart."
  api_server_format:
    type: str
    choices: [auto, text, hui]
    default: auto
    label: Cards for the Hermes UI+ app
    description: "For chats through Hermes' API server. auto = native cards for the Hermes UI+ mobile/web app when its hermes-ui-plus plugin is enabled, otherwise text; hui = always; text = never."
