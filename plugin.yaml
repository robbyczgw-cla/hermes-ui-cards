name: hermes-ui-cards
version: 0.1.0
manifest_version: 2
description: Interactive answer cards in Hermes Desktop — choices, checklists, comparisons, forms and confirmations the user answers with a click
author: robbyczgw-cla
license: MIT
homepage: https://github.com/robbyczgw-cla/hermes-ui-cards
requires_hermes: ">=0.22.6"
tags: [desktop, ui, cards]
provides_tools:
  - hui_present
provides_hooks:
  - pre_llm_call
  - transform_llm_output
requires_env: []
config_schema:
  api_server_format:
    type: str
    choices: [auto, text, hui]
    default: auto
    label: API server card format
    description: "auto sends HUI+ blocks when hermes-ui-plus is enabled; text always uses plain text."
  enabled:
    type: bool
    default: true
    label: Interactive cards
    description: Off = Hermes Desktop also gets the plain-text version of each card.
  compact:
    type: bool
    default: false
    label: Compact cards
    description: Less padding and smaller images, for narrow split views.
  accent:
    type: str
    choices: [app, blue, green, orange, purple, red]
    default: app
    label: Accent colour
    description: "app = the accent of your Desktop theme."
  undo_seconds:
    type: str
    choices: ["0", "4", "8"]
    default: "4"
    label: Undo time (seconds)
    description: "How long a compare pick waits before it is sent, so you can undo it. 0 = send at once."
  card_types:
    type: list
    default: [plan, review, checklist, compare, form, confirm, steps, decision, calc, rank, choice, schedule, recipe, flashcards, rating, slider, quiz]
    label: Card types
    description: "Card types Hermes may show. Remove a name to turn that type off; an empty list means all. hui_present refuses turned-off types at once; the tool description follows after a Hermes restart."
